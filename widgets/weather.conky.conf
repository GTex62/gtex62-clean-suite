--[[
  ${CONKY_SUITE_DIR:-~/.config/conky/gtex62-clean-suite}/widgets/weather.conky.conf
  Main weather + horizon + aviation widget

  • Uses theme.lua for fonts/colors and weather layout (weather.* tables).
  • Relies on lua/owm.lua for all drawing (horizon arc, planets, forecast tiles)
    and aviation blocks (METAR/TAF/advisories).
  • External scripts expected:
      ${CONKY_SUITE_DIR:-~/.config/conky/gtex62-clean-suite}/scripts/owm_fetch.sh
      ${CONKY_SUITE_DIR:-~/.config/conky/gtex62-clean-suite}/scripts/owm_fc_icons.sh
      ${CONKY_SUITE_DIR:-~/.config/conky/gtex62-clean-suite}/scripts/owm_fc_reduce.sh
      ${CONKY_SUITE_DIR:-~/.config/conky/gtex62-clean-suite}/scripts/owm_current_icon.sh
      METAR/TAF/advisory scripts referenced by lua/owm.lua.
]]

local HOME       = os.getenv("HOME") or ""
local SUITE_DIR  = os.getenv("CONKY_SUITE_DIR") or (HOME .. "/.config/conky/gtex62-clean-suite")
local XDG_CACHE_HOME = os.getenv("XDG_CACHE_HOME") or (HOME .. "/.cache")
local CACHE_DIR  = os.getenv("CONKY_CACHE_DIR") or (XDG_CACHE_HOME .. "/conky")
local THEME_PATH = os.getenv("CONKY_THEME_PATH") or (SUITE_DIR .. "/theme.lua")
local CURRENT_PNG = CACHE_DIR .. "/icons/current.png"
local theme      = dofile(THEME_PATH)
local FONT   = theme.font or "DejaVu Sans Mono:size=10"
local FG     = theme.fg or "FFFFFF"
local DIM    = theme.dim or "A0A0A0"

conky.config = {
  alignment              = 'top_left',
  background             = false,
  double_buffer          = true,
  imlib_cache_size       = 0,
  update_interval        = 1,

  use_xft                = true,
  font                   = FONT,

  own_window             = true,
  own_window_title       = 'conky-weather',
  own_window_type        = 'desktop',
  own_window_hints       = 'undecorated,sticky,skip_taskbar,skip_pager,below',
  own_window_argb_visual = true,
  own_window_argb_value  = 0,
  own_window_transparent = true,
  own_window_class       = 'Conky',

  -- Your chosen placement:
  gap_x                  = 3845,
  gap_y                  = 130,

  minimum_width          = 640,
  minimum_height         = 70,

  draw_shades            = false,
  draw_borders           = false,
  default_color          = FG,
  color1                 = DIM,

  lua_draw_hook_pre      = 'owm_draw_horizon',
  lua_load               = SUITE_DIR .. '/lua/owm.lua',
}

conky.text   = [[
# --- OpenWeather cache + forecast icon prep ---
${execi 600 ]] .. SUITE_DIR .. [[/scripts/owm_fetch.sh}
${execi 900 ]] .. SUITE_DIR .. [[/scripts/owm_fc_icons.sh}
${execi 900 ]] .. SUITE_DIR .. [[/scripts/owm_fc_reduce.sh}
# --- City name + current icon ---
${goto 254}${color1}${font DejaVu Sans Mono:size=8}${lua_parse owm city}${font}${color}
${voffset -34}${execi 120 ]] .. SUITE_DIR .. [[/scripts/owm_current_icon.sh ]] .. CACHE_DIR .. [[/owm_current.json ]] .. SUITE_DIR .. [[/icons/owm}
# NOTE: Uses CONKY_CACHE_DIR/XDG_CACHE_HOME for the image path (no $HOME expansion required).
${if_existing ]] .. CURRENT_PNG .. [[}${image ]] .. CURRENT_PNG .. [[ -p 210,90 -s 60x60}${endif}
# --- Horizon arc + sun/moon + planets ---
${lua_parse owm draw_horizon}
${lua_parse owm_sun_labels}

# One shared downward nudge for BOTH lines (tweak this only)
${voffset -8}

# --- Temperature + humidity group ---
${goto 300}${voffset -50}${font DejaVu Sans Mono:size=26}${color}${lua_parse owm temp}°${font}

# Humidity (keeps the same tight spacing relative to temp)
${goto 308}${voffset -12}${color1}${font DejaVu Sans Mono:size=12}${lua_parse owm humidity}%${font}${color}
#${image ${CONKY_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/conky}/icons/fc0.png -p 90,200 -s 48x48}
#${goto 140}${color}${execi 600 . ${CONKY_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/conky}/owm_days.vars; echo $D0_NAME}${color}
#${goto 140}${color1}${execi 600 . ${CONKY_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/conky}/owm_days.vars; printf "%s° / %s°" "$D0_HI" "$D0_LO"}${color}

# --- 5-day forecast tiles (dates + icons + temps) ---
${lua_parse owm draw_forecast_placeholder}







# --- Aviation weather blocks ---
${lua_parse metar}

${lua_parse taf}

${lua_parse advisories}

]]
